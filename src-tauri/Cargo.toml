[package]
name = "ntfier"
version = "1.2.0"
description = "Desktop notification client for ntfy"
authors = [""]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

[lib]
name = "ntfier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"

# Database (Diesel ORM with SQLite)
diesel = { version = "2.3", features = ["sqlite"] }
diesel_migrations = "2.3"
# Not imported anywhere: forces the `bundled` feature on diesel's transitive dep.
# Diesel has no bundled feature of its own (diesel-rs/diesel#3587).
# Ceiling is 0.37 - diesel 2.3 requires libsqlite3-sys <0.38.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket - use rustls instead of native-tls
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

# HTTP client - use rustls instead of native-tls.
# `rustls-no-provider` (not `rustls`) keeps aws-lc-rs out of the build: plain `rustls`
# forces it, which pulls aws-lc-sys + cmake + NASM. tauri-plugin-updater makes the same
# choice. The provider is installed explicitly in lib.rs::run().
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Utilities
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Secure credential storage - platform-native backends ship in `default` since v4
keyring = "4"
tauri-plugin-window-state = "2"

# Windows-specific enhanced notifications
[target.'cfg(windows)'.dependencies]
# Pinned to 0.7 to match what notify-rust pulls in via tauri-plugin-notification.
# 0.8 needs windows 0.62 and would add a third copy of the windows crate.
tauri-winrt-notification = "0.7"

# Type-safe bindings between Rust and TypeScript.
# These three hard-pin each other and must move as a unit.
specta = "=2.0.0-rc.25"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "0.0.12"

# Workspace lints configuration
[lints.rust]
# Deny unsafe code
unsafe_code = "deny"
# Warn on missing docs for public items (optional, enable when ready)
# missing_docs = "warn"

[lints.clippy]
# Clippy lint groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Deny dangerous patterns
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Allow some pedantic lints that are too strict
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
unnecessary_debug_formatting = "allow"
if_not_else = "allow"
match_same_arms = "allow"
significant_drop_tightening = "allow"
manual_let_else = "allow"
bool_to_int_with_if = "allow"
struct_field_names = "allow"
unnecessary_wraps = "allow"
manual_strip = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
match_bool = "allow"
const_is_empty = "allow"
